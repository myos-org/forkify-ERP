version: '3.8'

services:
  # ──────────────────────────────────────────────────────────────────────────
  # 1. DATABASE — MySQL 8.0
  # ──────────────────────────────────────────────────────────────────────────
  mysql:
    image: mysql:8.0
    container_name: klyro-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: food_erp_db
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_USER: klyro_user
      MYSQL_PASSWORD: klyropassword
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - klyro-network

  # ──────────────────────────────────────────────────────────────────────────
  # 2. CACHE & SESSIONS — Redis 7.2
  # ──────────────────────────────────────────────────────────────────────────
  redis:
    image: redis:7.2-alpine
    container_name: klyro-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass klyroredispassword
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "klyroredispassword", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - klyro-network

  # ──────────────────────────────────────────────────────────────────────────
  # 3. EVENT STREAMING — Apache Kafka (KRaft mode)
  # ──────────────────────────────────────────────────────────────────────────
  kafka:
    image: apache/kafka:3.7.0
    container_name: klyro-kafka
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    ports:
      - "9092:9092"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s
    networks:
      - klyro-network

  # ──────────────────────────────────────────────────────────────────────────
  # 4. BACKEND API — Spring Boot Modular Monolith
  # ──────────────────────────────────────────────────────────────────────────
  klyro-backend:
    build:
      context: ./Backend/foodManagementERP
      dockerfile: Dockerfile
    container_name: klyro-backend
    restart: unless-stopped
    environment:
      PORT: 8080
      DB_URL: jdbc:mysql://mysql:3306/food_erp_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USERNAME: klyro_user
      DB_PASSWORD: klyropassword
      JWT_SECRET: klyro-erp-production-grade-super-secret-jwt-key-2026-secure!
      ALLOWED_ORIGINS: "*"
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_PASSWORD: klyroredispassword
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - klyro-network

volumes:
  mysql_data:
  redis_data:
  kafka_data:

networks:
  klyro-network:
    driver: bridge
