# ===============================
# SERVER CONFIGURATION
# ===============================
server.port=${PORT:8080}

# Optional local secrets file (gitignored) — e.g. DB_URL, DB_USERNAME, DB_PASSWORD
spring.config.import=optional:file:.env[.properties]

# ===============================
# DATABASE CONFIGURATION
# ===============================
# Aiven for MySQL: set DB_URL=jdbc:mysql://<host>:<port>/defaultdb?sslMode=REQUIRED&serverTimezone=UTC
# plus DB_USERNAME (avnadmin) and DB_PASSWORD. Or set DB_HOST/DB_PORT/DB_NAME with DB_SSL=true.
spring.datasource.url=${SPRING_DATASOURCE_URL:${DATABASE_URL:${DB_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:food_erp_db}?useSSL=${DB_SSL:false}&serverTimezone=UTC&allowPublicKeyRetrieval=true}}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DB_USERNAME:${MYSQLUSER:${MYSQL_USER:root}}}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:${MYSQLPASSWORD:${MYSQL_PASSWORD:}}}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# HIKARI CONNECTION POOL
# ===============================
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-test-query=SELECT 1
spring.datasource.hikari.validation-timeout=5000

# ===============================
# JPA / HIBERNATE CONFIGURATION
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=false

# ===============================
# SUPER ADMIN BOOTSTRAP
# ===============================
# If set, this admin is created on startup when the username doesn't exist yet.
# SUPERADMIN_RESET=true also promotes/re-enables an existing user and resets its password.
app.superadmin.username=${SUPERADMIN_USERNAME:}
app.superadmin.email=${SUPERADMIN_EMAIL:}
app.superadmin.password=${SUPERADMIN_PASSWORD:}
app.superadmin.full-name=${SUPERADMIN_FULL_NAME:Super Admin}
app.superadmin.reset=${SUPERADMIN_RESET:false}

# ===============================
# JWT CONFIGURATION
# ===============================
jwt.secret=${JWT_SECRET:klyro-erp-default-secret-key-that-is-at-least-32-bytes-long}
jwt.expiration=86400000

# ===============================
# CORS CONFIGURATION
# ===============================
app.cors.allowed-origins=${ALLOWED_ORIGINS:*}

# ===============================
# ASYNC / THREAD POOL
# ===============================
spring.task.execution.pool.core-size=2
spring.task.execution.pool.max-size=10
spring.task.execution.pool.queue-capacity=500

# ===============================
# LOGGING
# ===============================
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=WARN
logging.level.com.fooderp=INFO

# ===============================
# GROQ API CONFIGURATION
# ===============================
groq.api.key=${GROQ_API_KEY:}

# ===============================
# FORCE WEB SERVER
# ===============================
spring.main.web-application-type=servlet
