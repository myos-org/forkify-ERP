# ===============================
# SERVER CONFIGURATION
# ===============================
server.port=${PORT:8080}

# ===============================
# DATABASE CONFIGURATION
# ===============================
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/food_erp_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# HIKARI CONNECTION POOL
# ===============================
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.max-lifetime=1800000

# ===============================
# JPA / HIBERNATE CONFIGURATION
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=false

# ===============================
# JWT CONFIGURATION
# ===============================
jwt.secret=${JWT_SECRET:klyro-erp-default-secret-key-that-is-at-least-32-bytes-long}
jwt.expiration=86400000

# ===============================
# CORS CONFIGURATION
# ===============================
app.cors.allowed-origins=${ALLOWED_ORIGINS:*}

# ===============================
# ASYNC / THREAD POOL
# ===============================
spring.task.execution.pool.core-size=2
spring.task.execution.pool.max-size=10
spring.task.execution.pool.queue-capacity=500

# ===============================
# LOGGING
# ===============================
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=WARN
logging.level.com.fooderp=INFO

# ===============================
# GROQ API CONFIGURATION
# ===============================
groq.api.key=${GROQ_API_KEY:}

# ===============================
# FORCE WEB SERVER
# ===============================
spring.main.web-application-type=servlet
